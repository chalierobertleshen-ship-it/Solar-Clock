<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic 4-Phase Solar Clock</title>
    <style>
        :root {
            /* Smoothly transitioned variables */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --accent-color: #fbbf24;
            --glow-color: rgba(251, 191, 36, 0.2);
            --phase-label: "Initializing";
        }
        
        body {
            background: var(--bg-gradient);
            color: #f0f6fc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 1.5s ease-in-out;
        }
        .clock-box {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            max-width: 460px;
            width: 100%;
        }
        .title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #9ca3af;
            margin-bottom: 0.3rem;
        }
        .phase-indicator {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 1rem;
            opacity: 0.9;
        }
        .solar-time {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
            margin: 0.5rem 0;
            text-shadow: 0 0 25px var(--glow-color);
            white-space: nowrap;
            transition: color 1.5s ease, text-shadow 1.5s ease;
        }
        .meta-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .standard-time {
            color: #9ca3af;
        }
        .drift-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .drift-ahead {
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }
        .drift-behind {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }
        .geo-data {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            color: #10b981;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="clock-box">
    <div class="title">True Solar Time</div>
    <div class="phase-indicator" id="sky-phase">☀️ Loading Phase...</div>
    <div class="solar-time" id="solar-clock">12:00:00 AM</div>
    
    <div class="meta-container">
        <span class="standard-time" id="standard-clock">Std: --:--:-- --</span>
        <span class="drift-badge" id="drift-clock">0.0m diff</span>
    </div>
    
    <div class="geo-data" id="geo-status">📡 Requesting GPS Location...</div>
</div>

<script>
    let solarOffsetMinutes = 0; 

    function calculateSolarOffset(longitude) {
        const tzOffsetHours = -(new Date().getTimezoneOffset() / 60);
        const standardMeridian = tzOffsetHours * 15; 
        const degreeDifference = longitude - standardMeridian;
        return degreeDifference * 4; 
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lon = position.coords.longitude;
                const lat = position.coords.latitude;
                solarOffsetMinutes = calculateSolarOffset(lon);
                
                document.getElementById('geo-status').textContent = 
                    `📍 Lat: ${lat.toFixed(2)} | Lon: ${lon.toFixed(2)}`;
                
                const driftBadge = document.getElementById('drift-clock');
                const absDiff = Math.abs(solarOffsetMinutes).toFixed(1);
                if (solarOffsetMinutes >= 0) {
                    driftBadge.textContent = `+${absDiff}m ahead of wall clock`;
                    driftBadge.className = "drift-badge drift-ahead";
                } else {
                    driftBadge.textContent = `-${absDiff}m behind wall clock`;
                    driftBadge.className = "drift-badge drift-behind";
                }
            },
            (error) => {
                solarOffsetMinutes = 0; 
                document.getElementById('geo-status').textContent = "⚠️ Using Standard Time Center";
                document.getElementById('geo-status').style.color = "#ef4444";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function formatTime12Hour(dateObj) {
        let hours = dateObj.getHours();
        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
        const seconds = String(dateObj.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12;
        hours = hours ? hours : 12;
        return {
            string: `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`,
            ampm: ampm,
            rawHours: dateObj.getHours(),
            rawMinutes: dateObj.getMinutes()
        };
    }

    function updateAtmosphere(solarInfo) {
        const root = document.documentElement;
        const phaseIndicator = document.getElementById('sky-phase');
        
        // Convert hours + minutes to a decimal total time format (e.g., 18:30 = 18.5)
        const timeDecimal = solarInfo.rawHours + (solarInfo.rawMinutes / 60);
        
        let bg, accent, glow, phaseText;

        // 🌅 PHASE 1: Sunrise / Dawn (5:00 AM to 8:00 AM)
        if (timeDecimal >= 5 && timeDecimal < 8) {
            bg = 'linear-gradient(135deg, #2e1065 0%, #701a75 50%, #f59e0b 100%)'; // Deep Purple to Amber Gold
            accent = '#f59e0b'; // Warm Dawn Gold
            glow = 'rgba(245, 158, 11, 0.4)';
            phaseText = '🌅 Sunrise Matrix';
        }
        // ☀️ PHASE 2: Bright Daylight Blue (8:00 AM to 5:00 PM / 17:00)
        else if (timeDecimal >= 8 && timeDecimal < 17) {
            bg = 'linear-gradient(135deg, #0284c7 0%, #0369a1 60%, #0f172a 100%)'; // Clear Sky Blue to Deep Base
            accent = '#38bdf8'; // Electric Sky Blue
            glow = 'rgba(56, 189, 248, 0.4)';
            phaseText = '☀️ High Bright Blue Sky';
        }
        // 🌇 PHASE 3: Sunset / Golden Hour (5:00 PM to 8:00 PM / 17:00 to 20:00)
        else if (timeDecimal >= 17 && timeDecimal < 20) {
            bg = 'linear-gradient(135deg, #1e1b4b 0%, #991b1b 50%, #f43f5e 100%)'; // Midnight Blue to Crimson Sunset
            accent = '#f43f5e'; // Crimson Sunset Red
            glow = 'rgba(244, 63, 94, 0.4)';
            phaseText = '🌇 Deep Crimson Sunset';
        }
        // 🌌 PHASE 4: Deep Absolute Midnight (8:00 PM to 5:00 AM)
        else {
            bg = 'linear-gradient(135deg, #020617 0%, #0b1329 100%)'; // Pure Cosmic Pitch Black / Deep Navy
            accent = '#a78bfa'; // Cosmic Nebula Purple
            glow = 'rgba(167, 139, 250, 0.2)';
            phaseText = '🌌 Absolute Deep Midnight';
        }

        // Inject the styles smoothly into the CSS root variables
        root.style.setProperty('--bg-gradient', bg);
        root.style.setProperty('--accent-color', accent);
        root.style.setProperty('--glow-color', glow);
        phaseIndicator.textContent = phaseText;
    }

    function tick() {
        const now = new Date();
        document.getElementById('standard-clock').textContent = `Std: ${formatTime12Hour(now).string}`;

        const solarDate = new Date(now.getTime() + (solarOffsetMinutes * 60000));
        const solarInfo = formatTime12Hour(solarDate);
        
        document.getElementById('solar-clock').textContent = solarInfo.string;
        
        // Pass the solar values to determine the background engine status
        updateAtmosphere(solarInfo);
    }

    setInterval(tick, 1000);
    tick();
</script>

</body>
</html>
