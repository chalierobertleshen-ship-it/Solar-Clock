<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://icons8.com">
    <title>True Border Solar Clock</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #0b0c10;
            display: flex; justify-content: center; align-items: center;
            font-family: system-ui, sans-serif; color: #fff;
        }
        .clock-card {
            text-align: center; background: #1f2833;
            padding: 30px; border-radius: 20px;
            width: 80vw; max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #00f5d4;
        }
        .time-display {
            font-size: 11vw; font-weight: bold; color: #00f5d4;
            font-family: monospace; margin: 10px 0; white-space: nowrap;
        }
        .status { font-size: 3.5vw; color: #2ed573; text-transform: uppercase; font-weight: bold;}
        .geo-info { font-size: 3.5vw; color: #a4b0be; margin-top: 10px; margin-bottom: 15px;}
        .slider-box { background: #151a21; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
        label { display: block; font-size: 3vw; color: #64748b; margin-bottom: 5px; text-transform: uppercase;}
        input[type=range] { width: 100%; accent-color: #00f5d4; cursor: pointer; }
    </style>
</head>
<body>

    <div class="clock-card">
        <div class="status">True Solar Absolute Time</div>
        <div class="time-display"><span id="solar-time">12:00:00</span><span id="ampm">AM</span></div>
        <div class="geo-info" id="coords-text">Longitude: 120.94° E</div>
        
        <!-- Live border crossing manual adjustment slider widget -->
        <div class="slider-box">
            <label id="slider-label">Travel Adjust: 0° Shift</label>
            <input type="range" id="long-slider" min="-180" max="180" value="0" step="1" oninput="shiftLocation(this.value)">
        </div>
    </div>

    <script>
        // Solid physical anchor for your hometown base position
        const BASE_LONGITUDE = 120.9421; 
        let activeShift = 0;

        // Retrieve previously saved travel positions from persistent browser cache memory
        if(localStorage.getItem('solar_travel_shift')) {
            activeShift = parseFloat(localStorage.getItem('solar_travel_shift'));
            document.getElementById('long-slider').value = activeShift;
        }

        function shiftLocation(val) {
            activeShift = parseFloat(val);
            localStorage.setItem('solar_travel_shift', activeShift);
        }

        function updateSolarClock() {
            const now = new Date();
            
            // Extract pure global master time directly from your device motherboard hardware
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            const utcSeconds = now.getUTCSeconds();
            const utcMilliseconds = now.getUTCMilliseconds();
            const utcTotalSeconds = (utcHours * 3600) + (utcMinutes * 60) + utcSeconds + (utcMilliseconds / 1000);

            // Compute exact current total global longitude 
            let targetLongitude = BASE_LONGITUDE + activeShift;
            if (targetLongitude > 180) targetLongitude -= 360;
            if (targetLongitude < -180) targetLongitude += 360;

            // Strict physical calculation: The sun crosses 1 degree of Earth area every 240 seconds
            const solarOffsetSeconds = targetLongitude * 240;
            let solarTotalSeconds = utcTotalSeconds + solarOffsetSeconds;

            if (solarTotalSeconds >= 86400) solarTotalSeconds -= 86400;
            if (solarTotalSeconds < 0) solarTotalSeconds += 86400;

            let sHours = Math.floor(solarTotalSeconds / 3600);
            const sMinutes = Math.floor((solarTotalSeconds % 3600) / 60);
            const sSeconds = Math.floor(solarTotalSeconds % 60);

            const ampm = sHours >= 12 ? 'PM' : 'AM';
            sHours = sHours % 12 || 12;

            const pad = (num) => String(num).padStart(2, '0');
            
            // Output rendering strings to app elements
            document.getElementById('solar-time').textContent = `${pad(sHours)}:${pad(sMinutes)}:${pad(sSeconds)}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('coords-text').textContent = `Longitude: ${targetLongitude.toFixed(2)}° ${targetLongitude >= 0 ? 'E' : 'W'}`;
            document.getElementById('slider-label').textContent = `Travel Adjust: ${activeShift > 0 ? '+' : ''}${activeShift}° Shift`;
        }

        updateSolarClock();
        setInterval(updateSolarClock, 200);
    </script>
</body>
</html>
