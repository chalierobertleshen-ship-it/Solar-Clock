<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Starfield Solar Clock</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #020617 0%, #0b1329 100%);
            --accent-color: #a78bfa;
            --glow-color: rgba(167, 139, 250, 0.2);
        }
        
        body {
            background: var(--bg-gradient);
            color: #f0f6fc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            transition: background 1.5s ease-in-out;
        }

        /* Pure CSS Performance-Optimized Star Layer */
        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            background-image: 
                radial-gradient(1px 1px at 25px 35px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 60px 120px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 180px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 280px 90px, #fff, rgba(0,0,0,0));
            background-size: 300px 300px;
            animation: twinkle 4s infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.98); }
            50% { opacity: 0.7; }
            100% { opacity: 0.4; transform: scale(1.02); }
        }

        .clock-box {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            max-width: 460px;
            width: 100%;
            z-index: 10;
        }
        .title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #9ca3af;
            margin-bottom: 0.3rem;
        }
        .phase-indicator {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 1rem;
            transition: color 1.5s ease;
        }
        .solar-time {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
            margin: 0.5rem 0;
            text-shadow: 0 0 25px var(--glow-color);
            white-space: nowrap;
            transition: color 1.5s ease, text-shadow 1.5s ease;
        }
        .meta-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .standard-time { color: #9ca3af; }
        .drift-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .drift-ahead { color: #34d399; background: rgba(52, 211, 153, 0.1); }
        .drift-behind { color: #f87171; background: rgba(248, 113, 113, 0.1); }
        .geo-data {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            color: #10b981;
        }
    </style>
</head>
<body>

<div class="starfield" id="stars"></div>

<div class="clock-box">
    <div class="title">True Solar Time</div>
    <div class="phase-indicator" id="sky-phase">Initializing...</div>
    <div class="solar-time" id="solar-clock">12:00:00 AM</div>
    
    <div class="meta-container">
        <span class="standard-time" id="standard-clock">Std: --:--:-- --</span>
        <span class="drift-badge" id="drift-clock">0.0m diff</span>
    </div>
    
    <div class="geo-data" id="geo-status">📡 Awaiting GPS...</div>
</div>

<script>
    let solarOffsetMinutes = 0; 

    // Isolated math engine - zero network calls
    function calculateSolarOffset(longitude) {
        const tzOffsetHours = -(new Date().getTimezoneOffset() / 60);
        return (longitude - (tzOffsetHours * 15)) * 4; 
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lon = position.coords.longitude;
                solarOffsetMinutes = calculateSolarOffset(lon);
                
                document.getElementById('geo-status').textContent = `📍 Lat: ${position.coords.latitude.toFixed(2)} | Lon: ${lon.toFixed(2)}`;
                
                const driftBadge = document.getElementById('drift-clock');
                const absDiff = Math.abs(solarOffsetMinutes).toFixed(1);
                driftBadge.textContent = `${solarOffsetMinutes >= 0 ? '+' : '-'}${absDiff}m from wall clock`;
                driftBadge.className = `drift-badge ${solarOffsetMinutes >= 0 ? 'drift-ahead' : 'drift-behind'}`;
            },
            () => {
                document.getElementById('geo-status').textContent = "⚠️ Center Meridian Mode";
                document.getElementById('geo-status').style.color = "#ef4444";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function formatTime12Hour(dateObj) {
        let hours = dateObj.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return {
            string: `${String(hours).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}:${String(dateObj.getSeconds()).padStart(2, '0')} ${ampm}`,
            ampm: ampm,
            rawHours: dateObj.getHours(),
            rawMinutes: dateObj.getMinutes()
        };
    }

    function updateAtmosphere(solarInfo) {
        const root = document.documentElement;
        const phaseIndicator = document.getElementById('sky-phase');
        const starLayer = document.getElementById('stars');
        const timeDecimal = solarInfo.rawHours + (solarInfo.rawMinutes / 60);
        
        let bg, accent, glow, phaseText, showStars = false;

        if (timeDecimal >= 5 && timeDecimal < 8) { // Sunrise
            bg = 'linear-gradient(135deg, #2e1065 0%, #701a75 50%, #f59e0b 100%)';
            accent = '#f59e0b';
            glow = 'rgba(245, 158, 11, 0.4)';
            phaseText = '🌅 Sunrise Matrix';
        } else if (timeDecimal >= 8 && timeDecimal < 17) { // Daylight Blue
            bg = 'linear-gradient(135deg, #0284c7 0%, #0369a1 60%, #0f172a 100%)';
            accent = '#38bdf8';
            glow = 'rgba(56, 189, 248, 0.4)';
            phaseText = '☀️ High Bright Blue Sky';
        } else if (timeDecimal >= 17 && timeDecimal < 20) { // Sunset
            bg = 'linear-gradient(135deg, #1e1b4b 0%, #991b1b 50%, #f43f5e 100%)';
            accent = '#f43f5e';
            glow = 'rgba(244, 63, 94, 0.4)';
            phaseText = '🌇 Deep Crimson Sunset';
        } else { // Midnight
            bg = 'linear-gradient(135deg, #020617 0%, #0b1329 100%)';
            accent = '#a78bfa';
            glow = 'rgba(167, 139, 250, 0.2)';
            phaseText = '🌌 Absolute Deep Midnight';
            showStars = true;
        }

        root.style.setProperty('--bg-gradient', bg);
        root.style.setProperty('--accent-color', accent);
        root.style.setProperty('--glow-color', glow);
        phaseIndicator.textContent = phaseText;
        starLayer.style.opacity = showStars ? "1" : "0";
    }

    function tick() {
        const now = new Date();
        document.getElementById('standard-clock').textContent = `Std: ${formatTime12Hour(now).string}`;
        const solarInfo = formatTime12Hour(new Date(now.getTime() + (solarOffsetMinutes * 60000)));
        document.getElementById('solar-clock').textContent = solarInfo.string;
        updateAtmosphere(solarInfo);
    }

    setInterval(tick, 1000);
    tick();
</script>

</body>
</html>
