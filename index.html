<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto-Tracking Solar Clock</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #0b0c10;
            display: flex; justify-content: center; align-items: center;
            font-family: system-ui, sans-serif; color: #fff;
        }
        .clock-card {
            text-align: center; background: #1f2833;
            padding: 30px; border-radius: 20px;
            width: 80vw; max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #a855f7;
        }
        .time-display {
            font-size: 11vw; font-weight: bold; color: #a855f7;
            font-family: monospace; margin: 10px 0; white-space: nowrap;
        }
        .status { font-size: 3.5vw; color: #2ed573; text-transform: uppercase; font-weight: bold;}
        .geo-info { font-size: 3vw; color: #a4b0be; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="clock-card">
        <div class="status">Auto-Solar Tracking Active</div>
        <div class="time-display"><span id="solar-time">12:00:00</span><span id="ampm">AM</span></div>
        <div class="geo-info" id="location-tag">Detecting network region...</div>
    </div>

    <script>
        function updateSolarClock() {
            const now = new Date();
            
            // 1. Get total standard UTC universal time passed today
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            const utcSeconds = now.getUTCSeconds();
            const utcMilliseconds = now.getUTCMilliseconds();
            const utcTotalSeconds = (utcHours * 3600) + (utcMinutes * 60) + utcSeconds + (utcMilliseconds / 1000);

            // 2. Automatically grab your phone's active system timezone offset
            // JavaScript returns this value in minutes (e.g., Philippines is -480 minutes)
            const timezoneOffsetMinutes = now.getTimezoneOffset();
            
            // Convert to a base longitude (Each 4 minutes of offset equals 1 full degree of Earth rotation)
            const calculatedLongitude = (timezoneOffsetMinutes / 4) * -1;

            // 3. Compute accurate solar variance seconds
            const solarOffsetSeconds = calculatedLongitude * 240;
            let solarTotalSeconds = utcTotalSeconds + solarOffsetSeconds;

            // Keep day transitions uniform
            if (solarTotalSeconds >= 86400) solarTotalSeconds -= 86400;
            if (solarTotalSeconds < 0) solarTotalSeconds += 86400;

            // 4. Build standard time formats
            let sHours = Math.floor(solarTotalSeconds / 3600);
            const sMinutes = Math.floor((solarTotalSeconds % 3600) / 60);
            const sSeconds = Math.floor(solarTotalSeconds % 60);

            const ampm = sHours >= 12 ? 'PM' : 'AM';
            sHours = sHours % 12 || 12;

            const pad = (num) => String(num).padStart(2, '0');
            
            // Render outputs directly to your interface elements
            document.getElementById('solar-time').textContent = `${pad(sHours)}:${pad(sMinutes)}:${pad(sSeconds)}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('location-tag').textContent = `Est. Base Longitude: ${calculatedLongitude}°`;
        }

        // Initialize and fire execution sequence loops
        updateSolarClock();
        setInterval(updateSolarClock, 200);
    </script>
</body>
</html>
