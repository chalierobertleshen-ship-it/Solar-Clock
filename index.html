<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Solar Position Clock</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f0f6fc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .clock-box {
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        .title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }
        .solar-time {
            font-size: 3.8rem;
            font-weight: 800;
            color: #fbbf24; /* Solar Gold */
            font-variant-numeric: tabular-nums;
            margin: 0.5rem 0;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
        }
        .standard-time {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .geo-data {
            font-size: 0.85rem;
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 8px;
            color: #10b981;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="clock-box">
    <div class="title">True Solar Time</div>
    <div class="solar-time" id="solar-clock">00:00:00</div>
    <div class="standard-time" id="standard-clock">Standard: --:--:--</div>
    <div class="geo-data" id="geo-status">📡 Requesting GPS Location...</div>
</div>

<script>
    let solarOffsetMinutes = 0; 
    let currentLongitude = null;

    // 1. Convert exact longitude into precise physical solar offset
    function calculateSolarOffset(longitude) {
        // The Earth rotates 360 degrees in 24 hours (1440 minutes)
        // This means 1 degree of longitude = exactly 4 minutes of time movement!
        
        // Step A: Find the standard timezone offset of the device in hours
        const tzOffsetHours = -(new Date().getTimezoneOffset() / 60);
        
        // Step B: Find the central meridian longitude for this standard timezone
        const standardMeridian = tzOffsetHours * 15; 
        
        // Step C: Calculate how many degrees away from the timezone center you physically are
        const degreeDifference = longitude - standardMeridian;
        
        // Step D: Total minutes to shift forward (+) or backward (-) from standard clock
        return degreeDifference * 4; 
    }

    // 2. Safely capture the user's location coordinates without data leaks
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                currentLongitude = position.coords.longitude;
                const latitude = position.coords.latitude;
                
                // Calculate the exact shift value
                solarOffsetMinutes = calculateSolarOffset(currentLongitude);
                
                document.getElementById('geo-status').textContent = 
                    `📍 Lat: ${latitude.toFixed(2)} | Lon: ${currentLongitude.toFixed(2)}`;
            },
            (error) => {
                // High precision fallback if GPS is blocked: Default to perfect center of UTC+8
                console.warn("GPS access denied. Defaulting to center meridian.");
                solarOffsetMinutes = 0; 
                document.getElementById('geo-status').textContent = "⚠️ Using Standard Time Center";
                document.getElementById('geo-status').style.color = "#ef4444";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // 3. Core calculation clock ticker loop (Lightweight, 0% CPU strain)
    function tick() {
        const now = new Date();
        
        // Format Standard Time for comparison
        const stdHours = String(now.getHours()).padStart(2, '0');
        const stdMinutes = String(now.getMinutes()).padStart(2, '0');
        const stdSeconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('standard-clock').textContent = `Standard Wall Clock: ${stdHours}:${stdMinutes}:${stdSeconds}`;

        // Shift standard time into true physical solar time based on your 100km concept
        const solarDate = new Date(now.getTime() + (solarOffsetMinutes * 60000));
        
        const solarHours = String(solarDate.getHours()).padStart(2, '0');
        const solarMinutesDisplay = String(solarDate.getMinutes()).padStart(2, '0');
        const solarSecondsDisplay = String(solarDate.getSeconds()).padStart(2, '0');
        
        document.getElementById('solar-clock').textContent = `${solarHours}:${solarMinutesDisplay}:${solarSecondsDisplay}`;
    }

    // Initialize clock tick instantly every single second
    setInterval(tick, 1000);
    tick();
</script>

</body>
</html>
