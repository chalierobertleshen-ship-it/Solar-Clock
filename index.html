<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Solar Clock</title>
    <style>
        :root { --bg: #050510; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); --text: #e2e8f0; --accent: #fbbf24; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: background 1s ease; }
        #stars { position: absolute; inset: 0; pointer-events: none; opacity: 0.3; }
        .clock-card { width: 340px; padding: 16px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 10; position: relative; overflow: hidden; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 0.95rem; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; }
        .btn { background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: rgba(255,255,255,0.1); }
        #canvas { width: 100%; height: 80px; display: block; margin-bottom: 12px; }
        .time-display { text-align: center; margin-bottom: 12px; }
        #solar-time { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -1px; }
        #std-time { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        .drift-box { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.7rem; margin-bottom: 4px; }
        .drift-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: bold; }
        #panel { position: absolute; inset: 0; background: #0b0f19; padding: 16px; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 8px; z-index: 20; }
        #panel.open { transform: translateX(0); }
        label { font-size: 0.7rem; color: #94a3b8; display: flex; flex-direction: column; gap: 4px; }
        input, select { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <div class="clock-card">
        <div class="row">
            <h1 id="status">Solar Clock</h1>
            <button class="btn" onclick="togglePanel(true)">⚙️ Astro</button>
        </div>
        <canvas id="canvas"></canvas>
        <div class="time-display">
            <div id="solar-time">00:00:00</div>
            <div id="std-time">Standard: --:--:--</div>
        </div>
        <div class="drift-box">
            <div style="color:#94a3b8; text-align:center;">TOTAL SOLAR DRIFT (EOT + LONGITUDE)</div>
            <div class="drift-grid">
                <div><span id="d-hrs">00</span>h</div>
                <div><span id="d-mins">00</span>m</div>
                <div><span id="d-secs">00</span>s</div>
            </div>
        </div>
        <div id="panel">
            <div class="row"><h1 style="color:#fff">Astro Settings</h1><button class="btn" onclick="togglePanel(false)">✕ Close</button></div>
            <label>Mode<select id="mode" onchange="switchMode(this.value)"><option value="auto">Auto (GPS)</option><option value="manual">Manual</option></select></label>
            <label>Latitude (-90 to 90)<input type="number" id="lat" step="any" min="-90" max="90" onchange="validate()"></label>
            <label>Longitude (-180 to 180)<input type="number" id="lng" step="any" min="-180" max="180" onchange="validate()"></label>
            <button class="btn" style="margin-top:auto; padding:8px; background:var(--accent); color:#000; font-weight:bold;" onclick="saveAstro()">Apply & Save</button>
        </div>
    </div>
    <script>
        let cfg = JSON.parse(localStorage.getItem('solar_cfg')) || { mode: 'auto', lat: 0, lng: 0 };
        let animId, starId, isVisible = true;
        const cv = document.getElementById('canvas'), ctx = cv.getContext('2d');
        const scv = document.getElementById('stars'), sctx = scv.getContext('2d');
        
        // Native Political Timezone Exception Map (Overrides raw 15-degree math alignment bugs)
        const tzOverrides = { "Asia/Manila": 120, "Asia/Shanghai": 120, "Asia/Singapore": 120, "Europe/London": 0, "Europe/Paris": 15, "Asia/Kolkata": 82.5 };

        function getTrueLSTM() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                if (tzOverrides[tz] !== undefined) return tzOverrides[tz];
            } catch(e) {}
            return (-new Date().getTimezoneOffset() / 60) * 15;
        }

        function resizeCanvases() {
            const dpr = window.devicePixelRatio || 1;
            cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; ctx.scale(dpr, dpr);
            scv.width = window.innerWidth * dpr; scv.height = window.innerHeight * dpr; sctx.scale(dpr, dpr);
            drawStars();
        }
        function togglePanel(open) { 
            document.getElementById('panel').classList.toggle('open', open);
            if(open) { document.getElementById('lat').value = cfg.lat.toFixed(4); document.getElementById('lng').value = cfg.lng.toFixed(4); document.getElementById('mode').value = cfg.mode; }
        }
        function switchMode(m) { document.getElementById('lat').disabled = document.getElementById('lng').disabled = (m === 'auto'); }
        function validate() {
            let lat = document.getElementById('lat'), lng = document.getElementById('lng');
            lat.value = Math.max(-90, Math.min(90, lat.value)); lng.value = Math.max(-180, Math.min(180, lng.value));
        }
        function saveAstro() {
            cfg.mode = document.getElementById('mode').value;
            cfg.lat = parseFloat(document.getElementById('lat').value) || 0; cfg.lng = parseFloat(document.getElementById('lng').value) || 0;
            localStorage.setItem('solar_cfg', JSON.stringify(cfg)); togglePanel(false); if(cfg.mode === 'auto') initGPS();
        }
        function initGPS() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(p => {
                if(cfg.mode !== 'auto') return;
                cfg.lat = p.coords.latitude; cfg.lng = p.coords.longitude;
                document.getElementById('status').innerText = "☀️ Solar Clock (GPS)";
            }, () => { if(cfg.mode === 'auto') document.getElementById('status').innerText = "☀️ Solar Clock (Fallback)"; }, { timeout: 5000, maximumAge: 300000 });
        }
        function drawStars() {
            if (!isVisible) return; sctx.clearRect(0,0,scv.width,scv.height); sctx.fillStyle = '#fff';
            for(let i=0; i<60; i++) { sctx.globalAlpha = 0.1 + Math.random()*0.8; sctx.fillRect(Math.random()*scv.clientWidth, Math.random()*scv.clientHeight, 1.5, 1.5); }
        }
        function getEoT(d) {
            let start = new Date(d.getFullYear(), 0, 1), n = Math.floor((d - start) / 86400000), b = (2 * Math.PI * (n - 81)) / 365;
            return 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
        }
        function updateClock() {
            if (!isVisible) return;
            const now = new Date(), eotMins = getEoT(now), localLong = cfg.lng, timezoneOffsetHrs = -now.getTimezoneOffset() / 60;
            const lstam = getTrueLSTM();
            const longCorrMins = 4 * (localLong - lstam), totalDriftMins = eotMins + longCorrMins;
            const solarNow = new Date(now.getTime() + totalDriftMins * 60000);
            
            document.getElementById('solar-time').innerText = solarNow.toTimeString().split(' ');
            document.getElementById('std-time').innerText = `Standard: ${now.toTimeString().split(' ')} (UTC${timezoneOffsetHrs >= 0 ? '+' : ''}${timezoneOffsetHrs})`;
            
            const totSecs = Math.abs(Math.round(totalDriftMins * 60));
            document.getElementById('d-hrs').innerText = String(Math.floor(totSecs / 3600)).padStart(2,'0');
            document.getElementById('d-mins').innerText = String(Math.floor((totSecs % 3600) / 60)).padStart(2,'0');
            document.getElementById('d-secs').innerText = String(totSecs % 60).padStart(2,'0');
            document.getElementById('d-hrs').parentElement.parentElement.style.color = totalDriftMins >= 0 ? '#4ade80' : '#f87171';

            const sHrs = solarNow.getHours() + solarNow.getMinutes()/60 + solarNow.getSeconds()/3600;
            let theme = '#050510', accent = '#fbbf24';
            if (sHrs >= 5 && sHrs < 7) theme = 'linear-gradient(135deg, #2e1065, #7c2d12)'; 
            else if (sHrs >= 7 && sHrs < 17) { theme = 'linear-gradient(135deg, #0f172a, #1e3a8a)'; accent = '#f59e0b'; }
            else if (sHrs >= 17 && sHrs < 19) theme = 'linear-gradient(135deg, #4c1d95, #7c2d12)';
            document.body.style.background = theme; document.documentElement.style.setProperty('--accent', accent);

            const w = cv.clientWidth, h = cv.clientHeight; ctx.clearRect(0,0,w,h);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.setLineDash();
            ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke(); ctx.setLineDash([]);
            
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
            for(let x=0; x<=w; x++) {
                let angle = ((x/w) * 2 * Math.PI) - (Math.PI / 2);
                let cy = (h / 2) - Math.sin(angle) * (h / 2 - 10);
                if(x===0) ctx.moveTo(x,cy); else ctx.lineTo(x,cy);
            }
            ctx.stroke();

            let sunAngle = ((sHrs / 24) * 2 * Math.PI) - (Math.PI / 2);
            let sunX = (sHrs / 24) * w, sunY = (h / 2) - Math.sin(sunAngle) * (h / 2 - 10);
            ctx.shadowBlur = 12; ctx.shadowColor = accent; ctx.fillStyle = accent;
            ctx.beginPath(); ctx.arc(sunX, sunY, 5, 0, 2*Math.PI); ctx.fill(); ctx.shadowBlur = 0;
            animId = requestAnimationFrame(updateClock);
        }
        document.addEventListener('visibilitychange', () => { isVisible = !document.hidden; if (isVisible) updateClock(); else cancelAnimationFrame(animId); });
        window.addEventListener('resize', resizeCanvases);
        window.onload = () => { resizeCanvases(); if(cfg.mode === 'auto') initGPS(); else document.getElementById('status').innerText = "☀️ Solar Clock (Manual)"; updateClock(); starId = setInterval(drawStars, 4000); };
    </script>
</body>
</html>
