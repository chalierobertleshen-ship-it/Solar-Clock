<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Solar Position Clock (AM/PM)</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f0f6fc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .clock-box {
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
        }
        .title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }
        .solar-time {
            font-size: 3.4rem;
            font-weight: 800;
            color: #fbbf24; /* Solar Gold */
            font-variant-numeric: tabular-nums;
            margin: 0.5rem 0;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
            white-space: nowrap;
        }
        .standard-time {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .geo-data {
            font-size: 0.85rem;
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 8px;
            color: #10b981;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="clock-box">
    <div class="title">True Solar Time</div>
    <div class="solar-time" id="solar-clock">12:00:00 AM</div>
    <div class="standard-time" id="standard-clock">Standard: --:--:-- --</div>
    <div class="geo-data" id="geo-status">📡 Requesting GPS Location...</div>
</div>

<script>
    let solarOffsetMinutes = 0; 
    let currentLongitude = null;

    // 1. Convert exact longitude into precise physical solar offset
    function calculateSolarOffset(longitude) {
        // Find standard timezone offset of the device in hours
        const tzOffsetHours = -(new Date().getTimezoneOffset() / 60);
        
        // Find central meridian longitude for this standard timezone
        const standardMeridian = tzOffsetHours * 15; 
        
        // Calculate degrees away from timezone center
        const degreeDifference = longitude - standardMeridian;
        
        // 1 degree of longitude = exactly 4 minutes of true time shift
        return degreeDifference * 4; 
    }

    // 2. Capture GPS securely
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                currentLongitude = position.coords.longitude;
                const latitude = position.coords.latitude;
                
                solarOffsetMinutes = calculateSolarOffset(currentLongitude);
                
                document.getElementById('geo-status').textContent = 
                    `📍 Lat: ${latitude.toFixed(2)} | Lon: ${currentLongitude.toFixed(2)}`;
            },
            (error) => {
                console.warn("GPS access denied. Defaulting to center meridian.");
                solarOffsetMinutes = 0; 
                document.getElementById('geo-status').textContent = "⚠️ Using Standard Time Center";
                document.getElementById('geo-status').style.color = "#ef4444";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // Helper formatting function to force clean AM/PM rendering without engine drift
    function formatTime12Hour(dateObj) {
        let hours = dateObj.getHours();
        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
        const seconds = String(dateObj.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12;
        hours = hours ? hours : 12; // The hour '0' should be '12'
        const hoursStr = String(hours).padStart(2, '0');
        
        return `${hoursStr}:${minutes}:${seconds} ${ampm}`;
    }

    // 3. Main isolated rendering loop
    function tick() {
        const now = new Date();
        
        // Display Standard Wall Clock in AM/PM
        document.getElementById('standard-clock').textContent = `Standard Wall Clock: ${formatTime12Hour(now)}`;

        // Calculate and shift standard time into true solar AM/PM time
        const solarDate = new Date(now.getTime() + (solarOffsetMinutes * 60000));
        document.getElementById('solar-clock').textContent = formatTime12Hour(solarDate);
    }

    // Run interval cleanly
    setInterval(tick, 1000);
    tick();
</script>

</body>
</html>
